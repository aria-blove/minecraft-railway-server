# minecraft-railway-serverservices:
  minecraft:
    image: itzg/minecraft-server:latest

    environment:
      EULA: "TRUE"

      # Minecraft
      TYPE: "PAPER"
      VERSION: "1.21.9"

      # RAM
      MEMORY: "4G"

      # Server settings
      MAX_PLAYERS: "5"
      ONLINE_MODE: "TRUE"
      DIFFICULTY: "normal"
      GAMEMODE: "survival"

      # Performance
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"

    ports:
      - "25565:25565"

    volumes:
      - minecraft-data:/data

    restart: unless-stopped

volumes:
  minecraft-data:
